<head>

<meta name="mobile-web-app-capable" content="yes">

     brand tokens, the kit's styles in order, and pantry's own last -->

<link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.31/theme/theme.css">
<link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.31/ui/ui.css">

<body>
<a class="pa-skip" href="#main">Skip to content</a>

<!-- the kit shell (ui/shell/shell.css): the bar and tab bar on a phone, a side bar from 600 px. Pantry draws each
     screen into #main from its hash routes (js/ui.js); the bar's lead and trail hold the screen's Back and actions. -->
<div class="ui-shell">
<header class="ui-bar">
  <span class="ui-bar-side" id="bar-lead"></span>
  <h2 class="ui-bar-title" id="bar-title" aria-hidden="true">Pantry</h2>
  <span class="ui-bar-side ui-bar-end" id="bar-trail"></span>
</header>

<nav class="ui-sidebar" aria-label="Sections">
  <p class="ui-sidebar-name"><img src="icons/icon.svg" alt="" width="28" height="28"> Pantry</p>
  <a class="ui-side-link" href="#/">Pantry</a>
  <a class="ui-side-link" href="#/items">Items</a>
  <a class="ui-side-link" href="#/shop">Shopping<span class="pa-side-count" id="pa-side-shop" aria-hidden="true" hidden></span></a>
  <a class="ui-side-link" href="#/settings">Settings</a>
</nav>

<main class="ui-screens">
  <section class="ui-screen" id="main" tabindex="-1">
    <h1 class="ui-large-title">Pantry</h1>
    <ul class="ui-list pa-list" aria-busy="true" aria-label="Loading">
      <li><div class="ui-row"><span class="pa-skeleton pa-skeleton--thumb"></span><span class="ui-row-main"><span class="pa-skeleton pa-skeleton--line"></span><span class="pa-skeleton pa-skeleton--short"></span></span></div></li>
      <li><div class="ui-row"><span class="pa-skeleton pa-skeleton--thumb"></span><span class="ui-row-main"><span class="pa-skeleton pa-skeleton--line"></span><span class="pa-skeleton pa-skeleton--short"></span></span></div></li>
    </ul>
  </section>
</main>

<nav class="ui-tabbar" aria-label="Tabs">
  <a class="ui-tab" href="#/"><span class="ui-tab-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-home"/></svg></span><span class="pa-tab-label">Pantry</span></a>
  <a class="ui-tab" href="#/items"><span class="ui-tab-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-list"/></svg></span><span class="pa-tab-label">Items</span></a>
  <button type="button" class="ui-tab ui-tab-action" data-act="go-add"><span class="ui-tab-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-plus"/></svg></span><span class="pa-tab-label">Add an item</span></button>
  <a class="ui-tab" href="#/shop"><span class="ui-tab-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-cart"/></svg><span class="pa-tab-badge" id="pa-shop-badge" aria-hidden="true" hidden></span></span><span class="pa-tab-label">Shopping</span></a><span class="pa-sr" id="pa-shop-sr"></span>
  <a class="ui-tab" href="#/settings"><span class="ui-tab-icon" aria-hidden="true"><svg class="ui-icon" aria-hidden="true"><use href="#i-settings"/></svg></span><span class="pa-tab-label">Settings</span></a>
</nav>
</div>

<div class="ui-action-bar pa-savebar" id="pa-toolbar" hidden>
  <button type="submit" form="pa-form" class="ui-primary pa-block" id="pa-save">Add to pantry</button>
</div>

<noscript><p class="pa-panel">The pantry needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
