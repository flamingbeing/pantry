# Live sign-in smoke test (app-devkit live-smoke; spec: pantry/test/live-smoke): signs the test user in on the deployed
# site and checks the signed-in, no-household shell. Runs by hand and after each successful Deploy. The test user is in
# no household and reads no app data. Needs repo secrets PANTRY_TEST_EMAIL and PANTRY_TEST_PASSWORD; without them the
# run says so and skips.
name: Live smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: flamingbeing/app-devkit/.github/workflows/live-smoke.yml@v1.10.0
    with:
      site-url: https://pantry.flamingbeing.com
      spec-path: pantry/test/live-smoke
      firebase-config-file: pantry/config.js
      checkout-ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      test-email: ${{ secrets.PANTRY_TEST_EMAIL }}
      test-password: ${{ secrets.PANTRY_TEST_PASSWORD }}
