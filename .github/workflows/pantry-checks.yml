# Pantry checks (pantry/NOTES.md, "How to test"): unit tests, the phone browser test (Playwright + axe) and family
# sharing against the local Firebase emulators (demo-pantry project, fake accounts), on PRs touching the pantry, the
# design kit it uses or Firebase's sign-in pages. Three jobs run side by side (was one 10-minute job). Browsers and emulator jars are cached.
name: Pantry checks
on:
  pull_request:
    paths:
      - 'pantry/**'
      - '__/**'
      - '.github/workflows/pantry-checks.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pantry/test/logic.test.mjs
      - run: node pantry/test/config.test.mjs
      - run: node pantry/test/quick.test.mjs
      - run: node pantry/test/tour.test.mjs
      - run: node pantry/test/places.test.mjs
      - run: node pantry/test/scan.test.mjs
      - run: node pantry/test/photo.test.mjs
      - run: node pantry/test/ops.test.mjs
      - run: node pantry/test/removed.test.mjs
      - run: node pantry/test/syncnow.test.mjs
      - run: node pantry/test/select.test.mjs
      - run: node pantry/test/order.test.mjs
      - run: node pantry/test/bulk-items.test.mjs
      - run: node pantry/test/listen-watch.test.mjs
      - run: node pantry/test/live-guards.test.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - name: Browser test
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SHOTS: ${{ runner.temp }}/pantry-shots
        run: node pantry/test/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantry-screenshots-browser
          path: ${{ runner.temp }}/pantry-shots
          if-no-files-found: ignore
  items:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pantry/test/logic.test.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - name: Items list (touch)
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
          SHOTS: ${{ runner.temp }}/pantry-shots
        run: node pantry/test/items.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantry-screenshots-items
          path: ${{ runner.temp }}/pantry-shots
          if-no-files-found: ignore
  sync:
    # pinned: Playwright 1.56.1 can't install Chromium on Ubuntu 26.04 (what ubuntu-latest became on 22 Oct 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.56.1 axe-core
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-13.29.1
      - name: Family sharing (local emulators)
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: pantry/test/run-sync.sh
